<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quest App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080b12; --bg2: #0f1420; --bg3: #161c2d; --border: #1e2740;
      --accent: #4f8cff; --green: #00e5a0; --red: #ff4d6a; --yellow: #ffc642;
      --text: #e2e8f8; --muted: #6b7a9e; --radius: 14px;
      --font: 'Outfit', sans-serif; --mono: 'JetBrains Mono', monospace;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    #app { min-height: 100vh; padding-bottom: 80px; }
    .page { display: none; padding: 20px 16px; animation: fadeIn .2s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* NAV */
    nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: var(--bg2); border-top: 1px solid var(--border); display: flex; padding-bottom: env(safe-area-inset-bottom); }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; background: none; border: none; color: var(--muted); font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; transition: color .2s; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 22px; height: 22px; }

    /* TYPOGRAPHY */
    .page-title { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 4px; }
    .page-sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .section-label { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

    /* CARDS */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
    .card + .card { margin-top: 10px; }
    .quest-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: border-color .2s, transform .15s; position: relative; overflow: hidden; margin-bottom: 12px; }
    .quest-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--green)); opacity: 0; transition: opacity .2s; }
    .quest-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .quest-card:hover::before { opacity: 1; }
    .quest-card.completed-card::before { background: var(--muted); opacity: 1; }
    .quest-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .quest-desc { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 12px; }
    .quest-meta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .quest-meta span { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
    .quest-reward { color: var(--green); font-weight: 700; font-family: var(--mono); font-size: 13px; }

    /* BADGE */
    .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; font-family: var(--mono); letter-spacing: .04em; text-transform: uppercase; }
    .badge-active    { background: rgba(0,229,160,.12); color: var(--green); }
    .badge-completed { background: rgba(79,140,255,.12); color: var(--accent); }
    .badge-draft     { background: rgba(107,122,158,.12); color: var(--muted); }
    .badge-cancelled { background: rgba(255,77,106,.12); color: var(--red); }
    .badge-winner    { background: rgba(255,198,66,.12); color: var(--yellow); }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 20px; border-radius: 10px; border: none; font-family: var(--font); font-size: 15px; font-weight: 700; cursor: pointer; transition: all .2s; width: 100%; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-green { background: var(--green); color: #000; }
    .btn-green:hover { filter: brightness(1.05); }
    .btn-ghost { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); }
    .btn-danger { background: rgba(255,77,106,.15); color: var(--red); border: 1px solid rgba(255,77,106,.3); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }
    .btn-sm { padding: 8px 16px; font-size: 13px; width: auto; }
    .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 8px; flex-shrink: 0; }

    /* INPUTS */
    .input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-family: var(--font); font-size: 15px; color: var(--text); outline: none; transition: border-color .2s; }
    .input:focus { border-color: var(--accent); }
    .input::placeholder { color: var(--muted); }
    textarea.input { resize: vertical; min-height: 90px; }
    select.input { cursor: pointer; }
    .input-group { margin-bottom: 10px; }
    .input-label { font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }

    /* FILTER TABS */
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .filter-tab { padding: 7px 16px; border-radius: 20px; border: 1px solid var(--border); background: none; color: var(--muted); font-family: var(--mono); font-size: 12px; font-weight: 700; cursor: pointer; transition: all .2s; }
    .filter-tab.active { border-color: var(--accent); background: rgba(79,140,255,.12); color: var(--accent); }

    /* DETAIL TABS */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin: 0 -16px 20px; }
    .tab-btn { flex: 1; padding: 13px 0; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-family: var(--mono); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; transition: all .2s; margin-bottom: -1px; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* STATS */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .stat-value { font-family: var(--mono); font-size: 28px; font-weight: 700; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* LEADERBOARD */
    .lb-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; margin-bottom: 6px; }
    .lb-row.top { background: var(--bg3); border: 1px solid var(--border); }
    .lb-rank { width: 30px; text-align: center; font-family: var(--mono); font-weight: 700; color: var(--muted); font-size: 13px; flex-shrink: 0; }
    .lb-name { flex: 1; font-weight: 700; font-size: 14px; }
    .lb-score { font-family: var(--mono); font-weight: 700; font-size: 16px; color: var(--green); }

    /* MY SCORE BAR */
    .my-score-bar { display: flex; gap: 24px; padding: 14px 18px; background: rgba(79,140,255,.08); border: 1px solid rgba(79,140,255,.25); border-radius: var(--radius); margin-bottom: 16px; }
    .my-score-item { text-align: center; }
    .my-score-val { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--accent); }
    .my-score-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; font-family: var(--mono); margin-top: 2px; }

    /* TASKS */
    .task-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .task-title { font-weight: 700; font-size: 15px; }
    .task-pts { font-family: var(--mono); color: var(--green); font-size: 13px; font-weight: 700; }
    .task-desc { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 12px; }
    .task-result { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 8px; font-weight: 700; font-size: 14px; }
    .task-result.correct { background: rgba(0,229,160,.1); color: var(--green); }
    .task-result.incorrect { background: rgba(255,77,106,.1); color: var(--red); }
    .task-input-row { display: flex; gap: 8px; }
    .task-input-row .input { flex: 1; }

    /* MULTIPLE CHOICE */
    .options-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
    .option-btn { width: 100%; padding: 12px 16px; background: var(--bg3); border: 2px solid var(--border); border-radius: 10px; color: var(--text); font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; text-align: left; }
    .option-btn:hover { border-color: var(--accent); }
    .option-btn.selected { border-color: var(--accent); background: rgba(79,140,255,.12); color: var(--accent); }
    .option-btn.correct-ans { border-color: var(--green); background: rgba(0,229,160,.1); color: var(--green); }
    .option-btn.wrong-ans { border-color: var(--red); background: rgba(255,77,106,.1); color: var(--red); }
    .option-btn:disabled { cursor: not-allowed; }

    /* MISC */
    .back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--muted); font-family: var(--font); font-size: 14px; cursor: pointer; padding: 0; margin-bottom: 18px; transition: color .2s; }
    .back-btn:hover { color: var(--text); }
    .quest-hero { background: linear-gradient(160deg, var(--bg3) 0%, var(--bg2) 100%); border-bottom: 1px solid var(--border); padding: 20px 16px 0; margin: -20px -16px 20px; }
    .quest-hero-title { font-size: 22px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 8px; }
    .quest-hero-meta { display: flex; gap: 14px; color: var(--muted); font-size: 13px; margin-bottom: 14px; flex-wrap: wrap; }
    .wallet-addr { background: var(--bg3); border-radius: 8px; padding: 10px 14px; font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; margin-bottom: 10px; }
    .spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 48px auto; display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 56px 20px; color: var(--muted); }
    .empty .icon { font-size: 40px; margin-bottom: 12px; }
    .empty p { font-size: 15px; margin-bottom: 16px; }
    .search-wrap { position: relative; margin-bottom: 14px; }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search-wrap .input { padding-left: 42px; }
    .divider { height: 1px; background: var(--border); margin: 18px 0; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .avatar { width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg, var(--accent), var(--green)); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .admin-quest-row { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
    .admin-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

    .task-page-hero { background:linear-gradient(160deg,var(--bg3) 0%,var(--bg2) 100%); border-bottom:1px solid var(--border); padding:20px 16px 16px; margin:-20px -16px 24px; }
    .progress-bar-wrap { height:6px; background:var(--bg3); border-radius:10px; margin-bottom:8px; overflow:hidden; }
    .progress-bar-fill { height:100%; border-radius:10px; background:linear-gradient(90deg,var(--accent),var(--green)); transition:width .4s ease; }
    .task-question { font-size:18px; font-weight:700; line-height:1.5; margin-bottom:24px; }
    .choice-btn { width:100%; padding:16px 20px; background:var(--bg2); border:2px solid var(--border); border-radius:12px; color:var(--text); font-family:var(--font); font-size:15px; font-weight:600; cursor:pointer; transition:all .2s; text-align:left; margin-bottom:10px; display:flex; align-items:center; gap:14px; }
    .choice-btn:hover:not(:disabled) { border-color:var(--accent); }
    .choice-btn.selected { border-color:var(--accent); background:rgba(79,140,255,.1); }
    .choice-btn.correct { border-color:var(--green); background:rgba(0,229,160,.1); color:var(--green); }
    .choice-btn.wrong { border-color:var(--red); background:rgba(255,77,106,.1); color:var(--red); }
    .choice-btn:disabled { cursor:not-allowed; }
    .choice-letter { width:32px; height:32px; border-radius:8px; background:var(--bg3); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:13px; font-weight:700; flex-shrink:0; }
    .task-list-item { display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--bg2); border:1px solid var(--border); border-radius:12px; margin-bottom:10px; cursor:pointer; transition:all .2s; }
    .task-list-item:hover { border-color:var(--accent); transform:translateX(4px); }
    .task-list-item.done { border-color:rgba(0,229,160,.3); }
    .task-status-icon { width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; }
    .task-status-icon.pending { background:var(--bg3); border:2px solid var(--border); color:var(--muted); font-family:var(--mono); font-size:13px; }
    .task-status-icon.correct { background:rgba(0,229,160,.15); border:2px solid var(--green); }
    .task-status-icon.wrong { background:rgba(255,77,106,.15); border:2px solid var(--red); }

    /* EDITOR */
    .editor-section { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .editor-section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .task-editor { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
    .task-num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .option-editor-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .option-editor-row .input { flex: 1; padding: 10px 14px; font-size: 14px; }
    .option-radio { width: 20px; height: 20px; cursor: pointer; accent-color: var(--green); flex-shrink: 0; }

    /* TOAST */
    #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 600; opacity: 0; transition: all .3s; z-index: 999; white-space: nowrap; pointer-events: none; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.success { border-color: var(--green); color: var(--green); }
    #toast.error { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="page active" id="page-home">
    <p class="page-title">⚡ Quest Board</p>
    <p class="page-sub">Complete quests, earn rewards</p>
    <div class="search-wrap">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="input" id="search-input" placeholder="Search quests…" />
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" data-status="">All</button>
      <button class="filter-tab" data-status="active">Active</button>
      <button class="filter-tab" data-status="completed">Done</button>
    </div>
    <div id="quest-list"><div class="spinner"></div></div>
  </div>

  <!-- QUEST DETAIL -->
  <div class="page" id="page-detail">
    <div id="detail-content"><div class="spinner"></div></div>
  </div>

  <!-- TASK DETAIL (отдельная страница) -->
  <div class="page" id="page-task">
    <div id="task-content"><div class="spinner"></div></div>
  </div>

  <!-- MY QUESTS -->
  <div class="page" id="page-myquests">
    <p class="page-title">🗡️ My Quests</p>
    <p class="page-sub">Your quest history</p>
    <div class="filter-tabs" id="myquests-filters">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="active">Active</button>
      <button class="filter-tab" data-filter="completed">Done</button>
    </div>
    <div id="myquests-list"><div class="spinner"></div></div>
  </div>

  <!-- PROFILE -->
  <div class="page" id="page-profile">
    <div id="profile-content"><div class="spinner"></div></div>
  </div>

  <!-- ADMIN LIST -->
  <div class="page" id="page-admin">
    <p class="page-title">🛡️ Admin Panel</p>
    <div id="admin-stats" style="margin-bottom:20px"></div>
    <button class="btn btn-primary" id="btn-new-quest" style="margin-bottom:16px">+ Create Quest</button>
    <p class="section-label">All Quests</p>
    <div id="admin-quest-list"><div class="spinner"></div></div>
  </div>

  <!-- ADMIN EDITOR (отдельная страница) -->
  <div class="page" id="page-editor">
    <button class="back-btn" id="editor-back">← Back to Admin</button>
    <p class="page-title" id="editor-title">New Quest</p>

    <div class="editor-section">
      <div class="editor-section-title">📋 Basic Info</div>
      <div class="input-group"><div class="input-label">Title *</div><input class="input" id="eq-title" placeholder="Quest title" /></div>
      <div class="input-group"><div class="input-label">Short description</div><input class="input" id="eq-short" placeholder="Shown in quest list" /></div>
      <div class="input-group"><div class="input-label">Full description</div><textarea class="input" id="eq-full" placeholder="Detailed description"></textarea></div>
      <div class="input-group"><div class="input-label">Reward</div><input class="input" id="eq-reward" placeholder="e.g. 100 TON for top 3" /></div>
      <div class="input-group"><div class="input-label">Rules</div><textarea class="input" id="eq-rules" placeholder="Quest rules" style="min-height:70px"></textarea></div>
      <div class="form-grid" style="margin-bottom:12px">
        <div><div class="input-label">Start date</div><input type="date" class="input" id="eq-start" /></div>
        <div><div class="input-label">End date</div><input type="date" class="input" id="eq-end" /></div>
      </div>
      <div class="input-group">
        <div class="input-label">Status</div>
        <select class="input" id="eq-status">
          <option value="draft">Draft</option>
          <option value="active">Active</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btn-save-quest-info">💾 Save Quest Info</button>
    </div>

    <div class="editor-section">
      <div class="editor-section-title">📝 Tasks</div>
      <div id="tasks-editor-list"></div>
      <button class="btn btn-ghost" id="btn-add-task" style="margin-top:4px">+ Add Task</button>
    </div>

    <div id="danger-zone" style="display:none">
      <div class="divider"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-green btn-sm" id="btn-complete-quest">✓ Complete & Pick Winners</button>
        <button class="btn btn-danger btn-sm" id="btn-delete-quest">🗑 Delete Quest</button>
      </div>
    </div>
  </div>

</div>

<!-- NAV -->
<nav>
  <button class="nav-btn active" data-page="home">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </button>
  <button class="nav-btn" data-page="myquests">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.5 10c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5z"/><path d="M20.5 10H19V8.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/><path d="M9.5 14c.83 0 1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5S8 21.33 8 20.5v-5c0-.83.67-1.5 1.5-1.5z"/><path d="M3.5 14H5v1.5c0 .83-.67 1.5-1.5 1.5S2 16.33 2 15.5 2.67 14 3.5 14z"/><path d="M14 14.5c0-.83.67-1.5 1.5-1.5h5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-5c-.83 0-1.5-.67-1.5-1.5z"/><path d="M15.5 19H14v1.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5-.67-1.5-1.5-1.5z"/><path d="M10 9.5C10 8.67 9.33 8 8.5 8h-5C2.67 8 2 8.67 2 9.5S2.67 11 3.5 11h5c.83 0 1.5-.67 1.5-1.5z"/><path d="M8.5 5H10V3.5C10 2.67 9.33 2 8.5 2S7 2.67 7 3.5 7.67 5 8.5 5z"/></svg>
    My Quests
